<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ระบบสะสมคะแนนความดี — ตาเบาวิทยา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- หน้า Login -->
<div id="login-view">
  <div id="leaf-field" aria-hidden="true"></div>
  <div class="login-box anim-fadein">
    <div class="login-logo">
      <div class="logo-icon">🌿</div>
      <h1>ตาเบาวิทยา</h1>
      <p>ระบบสะสมคะแนนความดีนักเรียน</p>
    </div>
    <div class="login-tabs">
      <button class="login-tab active" data-action="show-auth" data-view="student">👩‍🎓 นักเรียน</button>
      <button class="login-tab" data-action="show-auth" data-view="staff">👨‍🏫 ครู</button>
    </div>
    <div class="form-group">
      <label class="form-label">รหัสนักเรียน</label>
      <input class="form-input" id="student-code-input" placeholder="เช่น 65001" autofocus
             style="font-size:18px;text-align:center;letter-spacing:1px;">
    </div>
    <button class="btn-green" data-action="submit-student-login" style="padding:14px;">เข้าสู่ระบบ</button>
    <p class="login-note" id="login-note">พัฒนาระบบ : นายกิตติพงษ์ คำดี</p>
  </div>
</div>

<!-- แอป (Layout เดียว: Bottom Nav + Drawer) -->
<div id="app-a">
  <div id="header-a">
    <button id="drawer-btn-a" class="mgmt-menu-btn" data-action="open-drawer">☰</button>
    <div id="header-logo-a" class="header-logo">🌿</div>
    <span id="title-a" class="header-title"></span>
    <div class="header-right">
      <div id="badge-a" class="role-badge"></div>
      <div id="avatar-a" class="avatar" data-action="go-profile"></div>
    </div>
  </div>
  <div id="content-a" class="content-a"></div>
  <nav id="nav-a" class="bottom-nav"></nav>
</div>

<!-- Drawer (เมนูแบบ sidebar เลื่อนเข้าจากซ้าย) -->
<div id="drawer-overlay" class="drawer-overlay" data-action="close-drawer" style="display:none;">
  <aside id="drawer-panel" class="sidebar drawer-panel"></aside>
</div>

<!-- Toast notification -->
<div id="toast-container"></div>

<!-- Modal -->
<div id="modal-container"></div>

<!-- Level-up celebration overlay -->
<div id="levelup-container"></div>

<!-- ไลบรารีทั้งหมดเก็บไว้ในโปรเจกต์เอง (vendor/) ไม่พึ่ง CDN ภายนอกแล้ว —
     กันปัญหาเครือข่ายบางแห่ง (เช่น WiFi โรงเรียน) บล็อกโดเมน CDN เช่น jsdelivr/unpkg -->
<script src="vendor/supabase.min.js"></script>
<script src="vendor/jsQR.min.js"></script>
<script src="vendor/qrcode.min.js"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
