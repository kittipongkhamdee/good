<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ระบบสะสมคะแนนความดี — ตาเบาวิทยา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- หน้า Login -->
<div id="login-view">
  <div class="login-box anim-fadein">
    <div class="login-logo">
      <div class="logo-icon">🌿</div>
      <h1>ตาเบาวิทยา</h1>
      <p>ระบบสะสมคะแนนความดีนักเรียน</p>
    </div>
    <div class="role-cards">
      <button class="role-card" data-action="show-auth" data-view="student">
        <div class="role-icon" style="background:var(--gl);">👩‍🎓</div>
        <div class="role-info">
          <div class="role-name">นักเรียน</div>
          <div class="role-desc">เข้าด้วยรหัสนักเรียน</div>
        </div>
        <div class="role-arrow">›</div>
      </button>
      <button class="role-card" data-action="show-auth" data-view="staff">
        <div class="role-icon" style="background:oklch(0.93 0.07 200);">👨‍🏫</div>
        <div class="role-info">
          <div class="role-name">ครู / เจ้าหน้าที่</div>
          <div class="role-desc">เข้าด้วยอีเมลและรหัสผ่าน</div>
        </div>
        <div class="role-arrow">›</div>
      </button>
    </div>
    <p class="login-note" id="login-note">เชื่อมต่อฐานข้อมูลจริง — ตาเบาวิทยา</p>
  </div>
</div>

<!-- แอป (Layout เดียว: Bottom Nav + Drawer) -->
<div id="app-a">
  <div id="header-a">
    <button id="drawer-btn-a" class="mgmt-menu-btn" data-action="open-drawer">☰</button>
    <div class="header-logo">🌿</div>
    <span id="title-a" class="header-title"></span>
    <div class="header-right">
      <div id="badge-a" class="role-badge"></div>
      <div id="avatar-a" class="avatar" data-action="go-profile"></div>
    </div>
  </div>
  <div id="content-a" class="content-a"></div>
  <nav id="nav-a" class="bottom-nav"></nav>
</div>

<!-- Drawer (เมนูแบบ sidebar เลื่อนเข้าจากซ้าย) -->
<div id="drawer-overlay" class="drawer-overlay" data-action="close-drawer" style="display:none;">
  <aside id="drawer-panel" class="sidebar drawer-panel"></aside>
</div>

<!-- Toast notification -->
<div id="toast-container"></div>

<!-- Modal -->
<div id="modal-container"></div>

<!-- โหลด library จาก CDN โดยมีสำรอง (fallback) กรณี jsdelivr เข้าไม่ได้บนเครือข่ายบางแห่ง
     (เช่น เครือข่ายโรงเรียนบางที่บล็อก cdn.jsdelivr.net) — ลอง unpkg.com แทนอัตโนมัติ -->
<script>
  function loadScriptWithFallback(urls) {
    return new Promise((resolve) => {
      let i = 0;
      function tryNext() {
        if (i >= urls.length) { console.error('โหลดสคริปต์ไม่สำเร็จทุกแหล่ง:', urls[0]); resolve(false); return; }
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = () => resolve(true);
        s.onerror = tryNext;
        document.body.appendChild(s);
      }
      tryNext();
    });
  }

  function loadLocalScript(src) {
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      document.body.appendChild(s);
    });
  }

  Promise.all([
    loadScriptWithFallback([
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
      'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    ]),
    loadScriptWithFallback([
      'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
      'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js',
    ]),
    loadScriptWithFallback([
      'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js',
      'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js',
    ]),
  ]).then(() => loadLocalScript('supabase.js'))
    .then(() => loadLocalScript('app.js'));
</script>

</body>
</html>
